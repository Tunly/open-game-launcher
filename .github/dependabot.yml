# Dependabot is intentionally disabled. See README "Automation" section.
# To re-enable, set `enabled: true` per ecosystem and re-add a schedule.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    enabled: false

  - package-ecosystem: npm
    directory: /launcher
    schedule:
      interval: weekly
    enabled: false

  - package-ecosystem: cargo
    directory: /launcher/src-tauri
    schedule:
      interval: weekly
    enabled: false
