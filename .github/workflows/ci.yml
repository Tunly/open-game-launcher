name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      hosted_deploy_gate:
        description: Run the manual Supabase hosted deploy gate
        required: false
        type: boolean
        default: false
      hosted_deploy_dry_run:
        description: Print hosted deploy commands without deploying
        required: false
        type: boolean
        default: false
      hosted_environment:
        description: GitHub Environment that supplies hosted deploy secrets
        required: false
        type: choice
        options:
          - hosted-staging
          - hosted-production
        default: hosted-staging
      hosted_deploy_action:
        description: Hosted gate action
        required: false
        type: choice
        options:
          - preflight
          - deploy
          - smoke
          - all
        default: preflight

permissions:
  contents: read

# Cancel in-flight runs for the same ref when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ---------- Frontend ----------
  frontend:
    name: Frontend (typecheck / lint / test / build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: launcher/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: dummy

  # ---------- Rust: formatting ----------
  rust-fmt:
    name: Rust (cargo fmt --check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: Install cached target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: launcher/src-tauri -> target
      - name: Format check
        working-directory: launcher/src-tauri
        run: cargo fmt --all -- --check

  # ---------- Rust: clippy ----------
  rust-clippy:
    name: Rust (cargo clippy -D warnings)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: launcher/src-tauri -> target
      - name: Clippy (lib)
        working-directory: launcher/src-tauri
        run: cargo clippy --locked --lib --all-targets -- -D warnings
      - name: Clippy (binaries)
        working-directory: launcher/src-tauri
        run: cargo clippy --locked --bins -- -D warnings

  # ---------- Rust: tests ----------
  rust-test:
    name: Rust (cargo test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: launcher/src-tauri -> target
      - name: Test
        working-directory: launcher/src-tauri
        run: cargo test --locked

  # ---------- Rust: Windows build ----------
  rust-build-windows:
    name: Rust (cargo check --target x86_64-pc-windows-msvc)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: launcher/src-tauri -> target
      - name: Check (Windows MSVC)
        working-directory: launcher/src-tauri
        run: cargo check --locked --lib --target x86_64-pc-windows-msvc

  # ---------- Supabase: db lint ----------
  # Runs on push/PR and the manual hosted-deploy gate path, because it spins up
  # a Postgres container and the cold-start is ~30s.
  supabase-db-lint:
    name: Supabase (db lint)
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.hosted_deploy_gate)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.104.0
      - name: Start Postgres
        run: |
          # `supabase db lint` needs a live database. We start one via
          # the Supabase CLI in test mode (no auth/realtime/storage).
          supabase start --workdir . --no-api
      - name: Lint migrations
        working-directory: .
        run: supabase db lint --workdir . --local --fail-on error
      - name: Stop Supabase
        if: always()
        run: supabase stop --workdir . --no-api || true

  # ---------- Supabase: Edge Function contracts ----------
  supabase-edge-contracts:
    name: Supabase (Edge contracts)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.8.3
      - name: Validate hosted deploy gate script
        run: node --test scripts/hosted-deploy-gate.test.mjs
      - name: Validate external completion evidence script
        run: node --test scripts/external-evidence-check.test.mjs
      - name: Validate hosted cron evidence script
        run: node --test scripts/hosted-cron-evidence.test.mjs
      - name: Validate completion gate script
        run: node --test scripts/completion-gate.test.mjs
      - name: Validate release tracking script
        run: node --test scripts/release-tracking-check.test.mjs
      - name: Validate launcher prepare hook
        run: node --test scripts/launcher-prepare-hook.test.mjs
      - name: Validate release tag script
        run: node --test scripts/release-tag-check.test.mjs
      - name: Validate updater manifest generator
        run: node --test scripts/generate-updater-manifest.test.mjs
      - name: Validate release workflow contract
        run: node --test scripts/release-workflow-check.test.mjs
      - name: Validate UI evidence guard
        run: node --test scripts/ui-evidence-check.test.mjs
      - name: Check UI screenshot evidence for changed UI files
        env:
          BASE_REF_NAME: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          git fetch --no-tags origin main
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_RANGE="origin/${BASE_REF_NAME}...HEAD"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            BASE_RANGE="${BEFORE_SHA}...HEAD"
          else
            BASE_RANGE="origin/main...HEAD"
          fi
          node scripts/ui-evidence-check.mjs --base "$BASE_RANGE"
      - name: Validate Supabase DB lint wrapper
        run: node --test scripts/supabase-db-lint.test.mjs
      - name: Smoke external evidence helper output
        run: |
          node scripts/completion-gate.mjs plan
          node scripts/completion-gate.mjs status | tee completion-gate-status.json
          node -e "const fs = require('fs'); const status = JSON.parse(fs.readFileSync('completion-gate-status.json', 'utf8')); if (status.releaseReady !== false) throw new Error('completion status smoke must not claim release readiness without external proof');"
          node scripts/hosted-deploy-gate.mjs plan
          node scripts/external-evidence-check.mjs plan
          node scripts/hosted-cron-evidence.mjs plan
          node scripts/release-tracking-check.mjs
      - name: Validate Supabase functions test runner
        run: node --test scripts/supabase-functions-test.test.mjs
      - name: Check Supabase Edge Function sources
        run: pnpm supabase:functions:check
      - name: Validate verify route inventory
        run: node --test scripts/verify-route-inventory.test.mjs
      - name: Smoke verify route inventory CLI
        run: node scripts/verify-route-inventory.mjs
      - name: Test Supabase Edge contracts
        run: node scripts/supabase-functions-test.mjs

  # ---------- Coverage (release-gated) ----------
  # Coverage runs as a separate job because it doubles test time. Release tags
  # wait for this threshold-enforcing job before the external boundary gate can
  # package draft artifacts.
  coverage:
    name: Coverage (vitest, release-gated)
    runs-on: ubuntu-24.04
    needs: frontend
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: launcher/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests with coverage
        run: pnpm test:cov
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: launcher/coverage/

  # ---------- Build & Upload (release tags only) ----------
  release-boundary-gate:
    name: Release boundary gate (external evidence)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: hosted-production
    needs:
      [
        frontend,
        coverage,
        rust-fmt,
        rust-clippy,
        rust-test,
        rust-build-windows,
        supabase-db-lint,
        supabase-edge-contracts,
      ]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: launcher/pnpm-lock.yaml
      - name: Validate release tag version
        run: node scripts/release-tag-check.mjs "$GITHUB_REF_NAME"
      - name: Validate release tag source
        run: |
          git fetch --no-tags origin main
          HEAD_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$HEAD_SHA" != "$MAIN_SHA" ]; then
            echo "release tags must point at the current origin/main commit." >&2
            exit 1
          fi
      - name: Install launcher dependencies
        run: pnpm --dir launcher install --frozen-lockfile
      - name: Run external release boundary gate
        run: pnpm completion:gate:external
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_FUNCTIONS_URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          SUPABASE_REST_URL: ${{ secrets.SUPABASE_REST_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_AUTH_JWT: ${{ secrets.SUPABASE_AUTH_JWT }}
          ACCOUNT_DELETION_PROCESSOR_SECRET: ${{ secrets.ACCOUNT_DELETION_PROCESSOR_SECRET }}
          PRICE_DROP_NOTIFY_SECRET: ${{ secrets.PRICE_DROP_NOTIFY_SECRET }}
          PRESENCE_POLL_SECRET: ${{ secrets.PRESENCE_POLL_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
          PRESENCE_PROVIDER_TOKEN: ${{ secrets.PRESENCE_PROVIDER_TOKEN }}
          OGL_HOSTED_SMOKE_ORIGIN: ${{ vars.OGL_HOSTED_SMOKE_ORIGIN }}

  build-upload:
    name: Build & Upload (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    needs:
      [
        frontend,
        coverage,
        rust-fmt,
        rust-clippy,
        rust-test,
        rust-build-windows,
        supabase-db-lint,
        supabase-edge-contracts,
        release-boundary-gate,
      ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: open-game-launcher_${{ github.ref_name }}_amd64.AppImage
            artifacts: |
              launcher/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.AppImage
              launcher/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.deb
              launcher/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.rpm
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: open-game-launcher_${{ github.ref_name }}_windows_x64
            tauri_config: --config src-tauri/tauri.windows.conf.json
            artifacts: |
              launcher/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.exe
              launcher/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.exe.sig
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: open-game-launcher_${{ github.ref_name }}_aarch64.dmg
            artifacts: |
              launcher/src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.dmg
              launcher/src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.app.tar.gz
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: launcher/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: launcher/src-tauri -> target
      - name: Install frontend deps
        working-directory: launcher
        run: pnpm install --frozen-lockfile
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev
      - name: Validate Windows updater signing secrets
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}" || {
            echo "TAURI_SIGNING_PRIVATE_KEY is required for Windows updater releases." >&2
            exit 1
          }
          test -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" || {
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required for Windows updater releases." >&2
            exit 1
          }
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Build (Tauri)
        working-directory: launcher
        run: node ./node_modules/@tauri-apps/cli/tauri.js build --target ${{ matrix.target }} ${{ matrix.tauri_config }} -- --locked
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy's bundled strip does not understand RELR sections in
          # current Ubuntu/rolling-release shared libraries.
          APPIMAGE_EXTRACT_AND_RUN: ${{ runner.os == 'Linux' && '1' || '' }}
          NO_STRIP: ${{ runner.os == 'Linux' && '1' || '' }}
      - name: Validate release artifact inventory
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          missing=0
          while IFS= read -r artifact_path; do
            [ -n "$artifact_path" ] || continue
            matches=( $artifact_path )
            if [ "${#matches[@]}" -eq 0 ]; then
              echo "No release artifact matched contract path: $artifact_path" >&2
              missing=1
              continue
            fi
            printf 'Release artifact contract matched %s file(s): %s\n' "${#matches[@]}" "$artifact_path"
          done <<'EOF'
          ${{ matrix.artifacts }}
          EOF
          exit "$missing"
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs: [build-upload]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Generate signed updater manifest
        run: |
          node scripts/generate-updater-manifest.mjs \
            --artifacts release-artifacts \
            --output release-artifacts/latest.json \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --notes "OG Launcher ${GITHUB_REF_NAME#v}" \
            --pub-date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      - name: Generate release artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          tmpfile="$(mktemp)"
          find release-artifacts -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | while IFS= read -r -d '' file; do
                sha256sum "$file"
              done > "$tmpfile"
          test -s "$tmpfile"
          mv "$tmpfile" release-artifacts/SHA256SUMS.txt
      - name: Determine release channel
        id: release-channel
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          version_without_build="${version%%+*}"
          if [[ "$version_without_build" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: release-artifacts/**
          draft: false
          prerelease: ${{ steps.release-channel.outputs.prerelease }}
          make_latest: ${{ steps.release-channel.outputs.prerelease == 'false' }}
          generate_release_notes: true

  # ---------- Supabase: manual hosted deploy gate ----------
  # This workflow_dispatch-only job is not part of automatic push/PR CI. It is
  # the explicit hosted deployment handoff after local/contract CI has passed.
  hosted-deploy-gate:
    name: Supabase (hosted deploy gate)
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && inputs.hosted_deploy_gate
    environment: ${{ inputs.hosted_environment }}
    needs:
      [
        frontend,
        rust-fmt,
        rust-clippy,
        rust-test,
        rust-build-windows,
        supabase-db-lint,
        supabase-edge-contracts,
      ]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Validate hosted production source
        if: inputs.hosted_environment == 'hosted-production' && (inputs.hosted_deploy_action == 'deploy' || inputs.hosted_deploy_action == 'smoke' || inputs.hosted_deploy_action == 'all')
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "hosted-production deploy and smoke runs must use refs/heads/main." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          HEAD_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$HEAD_SHA" != "$MAIN_SHA" ]; then
            echo "hosted-production deploy and smoke runs must use the current origin/main commit." >&2
            exit 1
          fi
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: launcher/pnpm-lock.yaml
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.104.0
      - name: Install launcher dependencies
        run: pnpm --dir launcher install --frozen-lockfile
      - name: Validate hosted deploy gate script
        run: pnpm hosted:deploy-gate:test
      - name: Hosted deploy gate preflight
        if: inputs.hosted_deploy_action == 'preflight' || inputs.hosted_deploy_action == 'deploy' || inputs.hosted_deploy_action == 'all' || (inputs.hosted_environment == 'hosted-production' && inputs.hosted_deploy_action == 'smoke')
        run: pnpm hosted:deploy-gate:preflight
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_FUNCTIONS_URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          ACCOUNT_DELETION_PROCESSOR_SECRET: ${{ secrets.ACCOUNT_DELETION_PROCESSOR_SECRET }}
          PRICE_DROP_NOTIFY_SECRET: ${{ secrets.PRICE_DROP_NOTIFY_SECRET }}
          PRESENCE_POLL_SECRET: ${{ secrets.PRESENCE_POLL_SECRET }}
          OGL_HOSTED_DEPLOY_FUNCTIONS: ${{ vars.OGL_HOSTED_DEPLOY_FUNCTIONS }}
          OGL_HOSTED_SMOKE_ORIGIN: ${{ vars.OGL_HOSTED_SMOKE_ORIGIN }}
      - name: Deploy hosted Supabase functions
        if: inputs.hosted_deploy_action == 'deploy' || inputs.hosted_deploy_action == 'all'
        run: |
          if [ "$HOSTED_DEPLOY_DRY_RUN" = "true" ]; then
            pnpm hosted:deploy-gate:deploy:dry-run
          else
            pnpm hosted:deploy-gate:deploy:live
          fi
        env:
          HOSTED_DEPLOY_DRY_RUN: ${{ inputs.hosted_deploy_dry_run }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          OGL_HOSTED_DEPLOY_FUNCTIONS: ${{ vars.OGL_HOSTED_DEPLOY_FUNCTIONS }}
      - name: Smoke hosted Supabase functions
        if: ${{ inputs.hosted_deploy_action == 'smoke' || (inputs.hosted_deploy_action == 'all' && !inputs.hosted_deploy_dry_run) }}
        run: pnpm hosted:deploy-gate:smoke
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_FUNCTIONS_URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          ACCOUNT_DELETION_PROCESSOR_SECRET: ${{ secrets.ACCOUNT_DELETION_PROCESSOR_SECRET }}
          PRICE_DROP_NOTIFY_SECRET: ${{ secrets.PRICE_DROP_NOTIFY_SECRET }}
          PRESENCE_POLL_SECRET: ${{ secrets.PRESENCE_POLL_SECRET }}
          OGL_HOSTED_DEPLOY_FUNCTIONS: ${{ vars.OGL_HOSTED_DEPLOY_FUNCTIONS }}
          OGL_HOSTED_SMOKE_ORIGIN: ${{ vars.OGL_HOSTED_SMOKE_ORIGIN }}
