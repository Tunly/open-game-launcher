[package]
name = "open-game-launcher"
version = "0.1.0"
description = "A cross-platform desktop game launcher MVP."
authors = ["Open Game Launcher"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77"

[lib]
name = "open_game_launcher_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset"] }
reqwest = { version = "0.12", features = ["blocking", "json", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tungstenite = "0.24"
tokio = { version = "1", features = ["full"] }
sysinfo = { version = "0.31", features = ["serde"] }
futures-util = "0.3"
notify = "6"
zip = "4.2.0"
ureq = { version = "3.2.1", features = ["json"] }


[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
