[package]
name = "open-game-launcher"
version = "0.1.0"
description = "A cross-platform desktop game launcher MVP."
authors = ["Open Game Launcher"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.95"

[lib]
name = "open_game_launcher_lib"
crate-type = ["rlib"]

[features]
default = ["windows-uiautomation"]
# Legacy maintenance-automation state machine (AutomationSession). Unreachable
# from any live code path: providers.rs + runner.rs (used by actions.rs) never
# import it. Kept behind a non-default feature instead of deleted so the
# Windows UI-automation path can be wired up later without archaeology.
automation-session = []
linux-atspi = ["dep:atspi"]
macos-axuielement = ["dep:axuielement"]
windows-uiautomation = ["dep:uiautomation"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lazy_static = "1.4"
sha2 = "0.11"
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
reqwest = { version = "0.13", features = ["blocking", "json", "stream", "form", "query"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tokio = { version = "1", features = ["full"] }
sysinfo = { version = "0.39", features = ["serde"] }
futures-util = "0.3"
notify = "8"
zip = "8.6.0"
sevenz-rust2 = { version = "0.21.1", default-features = false, features = ["brotli", "bzip2", "deflate", "lz4", "ppmd", "util", "zstd"] }
ureq = { version = "3.2.1", features = ["json"] }
keyring = "4"
aes-gcm = "0.11"
argon2 = "0.5"
rand = "0.10"
base64 = "0.22"
ed25519-dalek = "3"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
nvml-wrapper = "0.12"
tauri-plugin-dialog = "2"


[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
uiautomation = { version = "=0.25.0", optional = true, default-features = false, features = ["control", "input"] }
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "macos")'.dependencies]
axuielement = { version = "=0.9.1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
atspi = { version = "=0.30.0", optional = true, default-features = false, features = ["proxies"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"

[dev-dependencies]
sevenz-rust2 = { version = "0.21.1", default-features = false, features = ["compress", "util"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
