<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OG-Launcher startet</title>
    <style>
      :root {
        color-scheme: light;
        background: #f5eedf;
        color: #171411;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
        padding: 14px;
        background: #f5eedf;
      }

      .neo-title {
        font-family: "Arial Narrow", Impact, sans-serif;
        font-style: italic;
        font-weight: 900;
        text-transform: uppercase;
      }

      .neo-copy {
        font-family: "Courier New", monospace;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .neo-dots {
        background: radial-gradient(circle, rgba(23, 20, 17, 0.08) 1px, transparent 1.2px), #fff9ed;
        background-size: 8px 8px;
      }

      .splash-panel {
        display: grid;
        width: 100%;
        height: 100%;
        grid-template-rows: auto 1fr;
        border: 4px solid #171411;
        box-shadow: 7px 7px 0 #1f1c0f;
      }

      .splash-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 4px solid #171411;
        background: #b7102a;
        color: #fff9ed;
      }

      .brand {
        padding: 10px 14px 9px;
        background: #b7102a;
        font-size: 24px;
        letter-spacing: -0.5px;
        line-height: 1;
      }

      .splash-content {
        display: grid;
        align-content: center;
        padding: 24px 28px 26px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: -0.6px;
        line-height: 1;
      }

      .progress {
        height: 11px;
        margin-top: 20px;
        overflow: hidden;
        border: 3px solid #171411;
        background: #efe6d4;
      }

      .progress::before {
        display: block;
        width: 30%;
        height: 100%;
        background: #007166;
        content: "";
        animation: load 1.1s steps(6, end) infinite;
      }

      @keyframes load {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(440%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .progress::before {
          animation: none;
        }

        .progress::before {
          transform: translateX(115%);
        }
      }
    </style>
  </head>
  <body>
    <main class="splash-panel neo-dots" aria-labelledby="splash-title">
      <header class="splash-header">
        <div class="brand neo-title">OG-Launcher</div>
      </header>

      <section class="splash-content">
        <h1 id="splash-title" class="neo-title">Loading Launcher</h1>
        <div class="progress" aria-hidden="true"></div>
      </section>
    </main>
  </body>
</html>
