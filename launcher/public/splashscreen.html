<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OG-Launcher starting</title>
    <script src="./splashscreen.js" defer></script>
    <style>
      :root {
        color-scheme: light;
        background: #f5eedf;
        color: #171411;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
        padding: 14px;
        background: #f5eedf;
      }

      .neo-title {
        font-family: "Arial Narrow", Impact, sans-serif;
        font-style: italic;
        font-weight: 900;
        text-transform: uppercase;
      }

      .neo-dots {
        background: radial-gradient(circle, rgba(23, 20, 17, 0.08) 1px, transparent 1.2px), #fff9ed;
        background-size: 8px 8px;
      }

      .splash-panel {
        display: grid;
        width: 100%;
        height: 100%;
        grid-template-rows: auto 1fr;
        border: 4px solid #171411;
        box-shadow: 7px 7px 0 #1f1c0f;
      }

      .splash-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 4px solid #171411;
        background: #b7102a;
        color: #fff9ed;
      }

      .brand {
        padding: 11px 16px 10px;
        background: #b7102a;
        font-size: 22px;
        letter-spacing: -0.4px;
        line-height: 1;
      }

      .splash-content {
        display: grid;
        align-content: center;
        justify-items: start;
        gap: 14px;
        padding: 24px 28px;
      }

      h1 {
        margin: 0;
        font-size: 30px;
        letter-spacing: -0.6px;
        line-height: 1;
      }

      .status {
        margin: 0;
        font-family: "Courier New", monospace;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #6b5d3f;
      }

      .progress {
        position: relative;
        width: 100%;
        height: 14px;
        overflow: hidden;
        border: 3px solid #171411;
        background: #efe6d4;
      }

      .progress-fill {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 0;
        background: #007166;
        transition: width 400ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .progress-fill.indeterminate {
        width: 40%;
        animation: splash-indeterminate 1.2s ease-in-out infinite;
      }

      @keyframes splash-indeterminate {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .progress-fill.indeterminate {
          animation: none;
          width: 100%;
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <main class="splash-panel neo-dots" aria-labelledby="splash-title">
      <header class="splash-header">
        <div class="brand neo-title">OG-Launcher</div>
      </header>

      <section class="splash-content" role="status" aria-live="polite">
        <h1 id="splash-title" class="neo-title">Starting up</h1>
        <p id="splash-status" class="status">Initializing …</p>
        <div class="progress" aria-hidden="true">
          <div id="splash-fill" class="progress-fill indeterminate"></div>
        </div>
      </section>
    </main>
  </body>
</html>
